plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moray.hero'
    compileSdk 34

    defaultConfig {
        applicationId 'com.moray.hero'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用调试证书签名，生成的 APK 可以直接安装（自用 / 家用足够）
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
